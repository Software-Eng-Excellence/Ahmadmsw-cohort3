openapi: 3.0.0
info:
  title: Order API
  description: API for managing orders and analytics
  version: 1.0.0
servers:
  - url: http://localhost:3000//docs/api

paths:
  /orders:
    get:
      tags: [CRUD]
      summary: Get all orders
      responses:
        '200':
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    post:
      tags: [CRUD]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      tags: [CRUD]
      summary: Get an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    put:
      tags: [CRUD]
      summary: Update an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: Order updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found
    delete:
      tags: [CRUD]
      summary: Delete an order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Order deleted successfully
        '404':
          description: Order not found

  /orders/total:
    get:
      tags: [analytics]
      summary: How many orders have been created in total
      responses:
        '200':
          description: How many orders have been created in total
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalOrders:
                    type: integer

  /orders/{itemtype}:
    get:
      tags: [analytics]
      summary: Number of orders per item type
      parameters:
      - name: itemtype
        in: path
        required: true
        schema:
            type: string
      responses:
        '200':
          description: Number of orders per item type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    itemType:
                      type: string
                    orderCount:
                      type: integer

  /order/totalRevenue:
    get:
      tags: [analytics]
      summary: Total revenue generated from all orders
      responses:
        '200':
          description: Total revenue generated from all orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalRevenue:
                    type: number
                    format: integer

  /orders/revenue/{itemtype}:
    get:
      tags: [analytics]
      summary: Revenue breakdown by item type
      parameters:
      - name: itemtype
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Revenue breakdown by item type
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    itemType:
                      type: string
                    revenue:
                      type: number
                      format: integer
  /orders/averageBuyPower:
    get:
      tags: [analytics]
      summary: Average Buy Power
      responses:
        '200':
          description: Average Buy Power
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    Average buy power:
                      type: number
                      format: integer
  /orders/averageBuyPower/{itemtype}:
    get:
      tags: [analytics]
      summary: Average Buy Power
      parameters:
      - name: itemtype
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Average Buy Power
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    Average buy power:
                      type: number
                      format: integer
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
          example: "12345"
        item:
          oneOf:
            - $ref: '#/components/schemas/Cake'
            - $ref: '#/components/schemas/Toy'
        quantity:
          type: integer
          example: 1
        price:
          type: number
          format: float
          example: 999.99
        status:
          type: string
          example: "Pending"
    Cake:
      type: object
      properties:
        type:
          type: string
          example: "Birthday"
        flavor:
          type: string
          example: "Chocolate"
        filling:
          type: string
          example: "Vanilla Cream"
        size:
          type: number
          example: 12
        layers:
          type: integer
          example: 3
        frostingType:
          type: string
          example: "Buttercream"
        frostingFlavor:
          type: string
          example: "Vanilla"
        decorationType:
          type: string
          example: "Sprinkles"
        decorationColor:
          type: string
          example: "Rainbow"
        customMessage:
          type: string
          example: "Happy Birthday!"
        shape:
          type: string
          example: "Round"
        allergies:
          type: string
          example: "Nuts"
        specialIngredients:
          type: string
          example: "Organic Sugar"
        packagingType:
          type: string
          example: "Box"
      Toy:
      type: object
      properties:
        type:
          type: string
          example: "Action Figure"
        material:
          type: string
          example: "Plastic"
        color:
          type: string
          example: "Red"
        size:
          type: string
          example: "Medium"
        brand:
          type: string
          example: "Hasbro"
        ageGroup:
          type: string
          example: "3+"
        features:
          type: string
          example: "Movable joints"
        batteryOperated:
          type: boolean
          example: false
        licensedCharacter:
          type: boolean
          example: true
        packagingType:
          type: string
          example: "Box"      
  